server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        include /etc/nginx/mime.types;
        application/wasm wasm;
    }
    default_type application/octet-stream;

    location = / {
        return 302 /lab/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|json|ipynb|wasm|data|so|html)$ {
        try_files $uri =404;
    }
}
